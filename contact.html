<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - My Web Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">MyProject</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="content-block">
      <h1>Contact Us</h1>
      <p>Have questions or feedback? Reach out to us using the form below:</p>
      
      <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent!');">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Your Full Name" />

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="your.email@example.com" />

        <label for="message">Message</label>
        <textarea id="message" rows="5" required placeholder="Type your message here..."></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Web Project. All rights reserved.</p>
  </footer>
</body>
</html>
